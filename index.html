<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор Игры</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 90%;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #e1e1e6;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-card {
            background: #202024;
            border: 2px solid #2e2e35;
            border-radius: 12px;
            padding: 25px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00875f;
            background: #29292e;
            box-shadow: 0 8px 25px rgba(0, 135, 95, 0.3);
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .game-desc {
            font-size: 0.95rem;
            color: #a8a8b3;
        }

        .btn {
            margin-top: 15px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #00875f;
            color: white;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .game-card:hover .btn {
            background-color: #00b37e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Выберите игру</h1>
        
        <div class="game-grid">
            <!-- Кнопка 1: Шутер -->
            <a href="shooter.html" class="game-card">
                <div class="game-title">🎯 Shooter</div>
                <div class="game-desc">Динамичный шутер прямо в браузере</div>
                <div class="btn">Играть</div>
            </a>

            <!-- Кнопка 2: Кликер Standoff 2 -->
            <a href="standoff2_clicker.html" class="game-card">
                <div class="game-title">💥 Standoff 2 Clicker</div>
                <div class="game-desc">Кликай, зарабатывай и прокачивайся</div>
                <div class="btn">Играть</div>
            </a>
        </div>
    </div>

</body>
</html>
