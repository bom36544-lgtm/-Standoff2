<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Standoff 2D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameCanvas {
            display: block;
            background-color: #2b2b2b;
            touch-action: none;
        }
        /* Элементы HUD / Интерфейса */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #ammo-box {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ffcc00;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #reload-btn {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(255, 204, 0, 0.8);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            display: none; /* Включается на сенсорных устройствах */
            z-index: 10;
        }
        /* Сенсорный джойстик */
        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: none; /* Включается на мобильных */
            z-index: 10;
        }
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 204, 0, 0.6);
            border-radius: 50%;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3333;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            display: none;
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #ff3333;
        }
        #restart-btn {
            margin-top: 15px;
            padding: 10px 25px;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="hud">
        HP: <span id="hp">100</span> | Убито: <span id="score">0</span>
    </div>
    <div id="ammo-box">
        АК-47: <span id="ammo">30</span> / ∞
    </div>
    <button id="reload-btn">R</button>

    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>

    <div id="game-over">
        <div>ВЫ ПОГИБЛИ</div>
        <button id="restart-btn" onclick="restartGame()">Играть снова</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Подгоняем размер Canvas под экран
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        if (isMobile) {
            document.getElementById('joystick-zone').style.display = 'block';
            document.getElementById('reload-btn').style.display = 'block';
        }

        // Состояние игры
        let gameActive = true;
        let score = 0;

        // Игрок (Спецназ / CT)
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 18,
            color: '#2a75d3', // Синий цвет CT
            speed: 3.5,
            angle: 0,
            hp: 100,
            maxHp: 100,
            ammo: 30,
            maxAmmo: 30,
            isReloading: false
        };

        // Клавиши клавиатуры
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyR') reload();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Позиция мыши для ПК
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let isMouseDown = false;

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('mousedown', e => {
            if (e.button === 0) isMouseDown = true;
        });
        window.addEventListener('mouseup', e => {
            if (e.button === 0) isMouseDown = false;
        });

        // Управление сенсором (Мобильные)
        const joyZone = document.getElementById('joystick-zone');
        const joyStick = document.getElementById('joystick-stick');
        let joyVector = { x: 0, y: 0 };
        let joyTouchId = null;
        let shootTouchId = null;

        window.addEventListener('touchstart', e => {
            for (let touch of e.changedTouches) {
                // Если нажатие в левой части экрана — активируем джойстик
                if (touch.clientX < window.innerWidth / 2 && joyTouchId === null) {
                    joyTouchId = touch.identifier;
                    updateJoystick(touch);
                } 
                // Если в правой — прицеливание и стрельба
                else if (touch.clientX >= window.innerWidth / 2 && shootTouchId === null) {
                    shootTouchId = touch.identifier;
                    updateMobileAim(touch);
                    isMouseDown = true;
                }
            }
        });

        window.addEventListener('touchmove', e => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) {
                    updateJoystick(touch);
                } else if (touch.identifier === shootTouchId) {
                    updateMobileAim(touch);
                }
            }
        });

        function handleTouchEnd(e) {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) {
                    joyTouchId = null;
                    joyVector = { x: 0, y: 0 };
                    joyStick.style.top = '35px';
                    joyStick.style.left = '35px';
                }
                if (touch.identifier === shootTouchId) {
                    shootTouchId = null;
                    isMouseDown = false;
                }
            }
        }
        window.addEventListener('touchend', handleTouchEnd);
        window.addEventListener('touchcancel', handleTouchEnd);

        function updateJoystick(touch) {
            const rect = joyZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.hypot(dx, dy);
            const maxDist = 40;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joyStick.style.left = `${35 + dx}px`;
            joyStick.style.top = `${35 + dy}px`;

            joyVector.x = dx / maxDist;
            joyVector.y = dy / maxDist;
        }

        function updateMobileAim(touch) {
            mouseX = touch.clientX;
            mouseY = touch.clientY;
        }

        document.getElementById('reload-btn').addEventListener('touchstart', (e) => {
            e.stopPropagation();
            reload();
        });

        // Пули и Террористы (Враги)
        const bullets = [];
        const enemies = [];
        let lastShootTime = 0;
        const shootInterval = 120; // Скорострельность АК-47 (мс)

        function reload() {
            if (player.isReloading || player.ammo === player.maxAmmo) return;
            player.isReloading = true;
            document.getElementById('ammo').innerText = "Перезарядка...";
            setTimeout(() => {
                player.ammo = player.maxAmmo;
                player.isReloading = false;
                document.getElementById('ammo').innerText = player.ammo;
            }, 1500);
        }

        function spawnEnemy() {
            if (!gameActive) return;
            // Спавн за пределами экрана
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -30 : canvas.width + 30;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -30 : canvas.height + 30;
            }
            
            enemies.push({
                x: x,
                y: y,
                radius: 18,
                color: '#d35400', // Оранжевый/террорист (T)
                speed: 1.8 + Math.random() * 0.8,
                hp: 3
            });
        }
        setInterval(spawnEnemy, 1200);

        function shoot() {
            if (!gameActive || player.isReloading) return;
            if (player.ammo <= 0) {
                reload();
                return;
            }

            const now = Date.now();
            if (now - lastShootTime >= shootInterval) {
                lastShootTime = now;
                player.ammo--;
                document.getElementById('ammo').innerText = player.ammo;

                // Небольшой разброс пули (как в Standoff)
                const spread = (Math.random() - 0.5) * 0.1;
                const finalAngle = player.angle + spread;

                bullets.push({
                    x: player.x + Math.cos(player.angle) * player.radius,
                    y: player.y + Math.sin(player.angle) * player.radius,
                    vx: Math.cos(finalAngle) * 12,
                    vy: Math.sin(finalAngle) * 12,
                    radius: 3
                });
            }
        }

        // Обновление логики игры
        function update() {
            if (!gameActive) return;

            // Движение ПК (WASD)
            let dx = 0;
            let dy = 0;
            if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

            // Движение от джойстика
            if (joyVector.x !== 0 || joyVector.y !== 0) {
                dx = joyVector.x;
                dy = joyVector.y;
            } else if (dx !== 0 && dy !== 0) {
                // Нормализация диагонали для клавиатуры
                dx *= 0.7071;
                dy *= 0.7071;
            }

            player.x += dx * player.speed;
            player.y += dy * player.speed;

            // Ограничение границами экрана
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Поворот игрока в сторону прицела
            player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);

            // Автострельба при зажатой клавише/таче
            if (isMouseDown) {
                shoot();
            }

            // Движение пуль
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Удаление пуль за экраном
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // Логика врагов
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                
                // Враг идет к игроку
                const eAngle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(eAngle) * e.speed;
                e.y += Math.sin(eAngle) * e.speed;

                // Столкновение с игроком
                const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distToPlayer < player.radius + e.radius) {
                    player.hp -= 10;
                    document.getElementById('hp').innerText = Math.max(0, player.hp);
                    enemies.splice(i, 1);

                    if (player.hp <= 0) {
                        gameOver();
                    }
                    continue;
                }

                // Попадание пуль во врага
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    const distToBullet = Math.hypot(e.x - b.x, e.y - b.y);

                    if (distToBullet < e.radius + b.radius) {
                        e.hp--;
                        bullets.splice(j, 1);

                        if (e.hp <= 0) {
                            enemies.splice(i, 1);
                            score++;
                            document.getElementById('score').innerText = score;
                        }
                        break;
                    }
                }
            }
        }

        // Отрисовка
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Сетка на полу (имитация текстуры Sandstone / Dust)
            ctx.strokeStyle = '#383838';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            if (!gameActive) return;

            // Отрисовка пуль
            ctx.fillStyle = '#ffcc00';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Отрисовка врагов (T)
            enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x, e.y);
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                ctx.rotate(angle);

                // Тело врага
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
                ctx.fill();

                // Оружие врага
                ctx.fillStyle = '#000';
                ctx.fillRect(5, 5, 12, 4);

                ctx.restore();
            });

            // Отрисовка игрока (CT)
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            // Тело
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // Руки и оружие (АК-47)
            ctx.fillStyle = '#111';
            ctx.fillRect(8, 6, 18, 5); // Ствол

            ctx.restore();

            // Прицел
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(mouseX - 12, mouseY);
            ctx.lineTo(mouseX + 12, mouseY);
            ctx.moveTo(mouseX, mouseY - 12);
            ctx.lineTo(mouseX, mouseY + 12);
            ctx.stroke();
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.hp = player.maxHp;
            player.ammo = player.maxAmmo;
            player.isReloading = false;
            score = 0;
            enemies.length = 0;
            bullets.length = 0;
            
            document.getElementById('hp').innerText = player.hp;
            document.getElementById('score').innerText = score;
            document.getElementById('ammo').innerText = player.ammo;
            document.getElementById('game-over').style.display = 'none';
            
            gameActive = true;
        }

        // Главный игровой цикл
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
